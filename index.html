<!DOCTYPE html>
<html lang="zh-cn">
<head>

<meta charset="UTF-8">
<title>多角色平台控制台示例</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
  <div id="login">
    <h2>选择角色登录</h2>
    <select id="roleSelect">
      <option value="admin">平台管理员</option>
      <option value="pm">项目经理</option>
      <option value="architect">系统架构师</option>
      <option value="sim">仿真工程师</option>
      <option value="model">建模工程师</option>
    </select>
    <button onclick="login()">登录</button>
  </div>


<div id="console" class="hidden">
  <header>
    <h1 id="roleTitle"></h1>
    <div>
      <button id="themeBtn" onclick="toggleTheme()">亮/暗</button>
      <span id="messageCenter" onclick="toggleMessages()">消息(0)</span>
      <button id="logout" onclick="logout()">退出</button>
    </div>
  </header>
  <div id="messages" class="hidden">
    <h3>消息中心</h3>
    <ul id="messageList"></ul>
    <button onclick="closeMessages()">关闭</button>
  </div>
  <div class="layout">
    <nav id="sidebar"></nav>
    <div class="mainArea">
      <ul id="tabs">
        <li data-tab="overview" class="active">总览</li>
        <li data-tab="daily">日常</li>
        <li data-tab="stats">统计</li>
        <li data-tab="settings">设置</li>
      </ul>
      <div id="tab-overview" class="tab">
        <p class="hint">可拖拽模块卡片以调整顺序</p>
      </div>
      <div id="tab-daily" class="tab hidden"></div>
      <div id="tab-stats" class="tab hidden"></div>
      <div id="tab-settings" class="tab hidden"></div>
    </div>
    <aside id="extra"></aside>
  </div>
  <footer id="statusBar">系统正常运行</footer>
</div>

<script src="script.js"></script>

</body>
</html>
